name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema pyyaml
      - name: openapi.json and the schema files are valid JSON / the schema is a valid JSON Schema
        run: |
          python -c "
          import json
          from jsonschema.validators import validator_for
          json.load(open('openapi/openapi.json'))
          s = json.load(open('schemas/activity-content.schema.json'))
          validator_for(s).check_schema(s)
          s2 = json.load(open('schemas/activity-content.v2.schema.json'))
          validator_for(s2).check_schema(s2)
          v = validator_for(s2)(s2)
          v.validate(json.load(open('test-vectors/activity-v2/mixed-practice.stored.json')))
          json.load(open('test-vectors/activity-v2/invalid-cases.json'))
          json.load(open('test-vectors/activity-v2/mixed-practice.wire.json'))
          for f in ['test-vectors/mastery/mastery-vectors.json', 'test-vectors/mastery/streak-vectors.json']:
              json.load(open(f))
          "
      - name: errors.yaml is valid YAML
        run: python -c "import yaml; yaml.safe_load(open('errors/errors.yaml'))"